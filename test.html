<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Multiplayer Test</title>
</head>
<body>
  <h1>Chess Multiplayer Test</h1>

  <p id="status">Connecting...</p>
  <p id="match">No match yet.</p>

  <script>
    const SERVER_URL = "wss://chess-multiplayer-server-ok3x.onrender.com";

    const status = document.getElementById("status");
    const match = document.getElementById("match");

    const socket = new WebSocket(SERVER_URL);

    socket.addEventListener("open", () => {
      status.textContent = "Connected to server.";

      socket.send(JSON.stringify({
        type: "FIND_MATCH"
      }));

      status.textContent = "Finding opponent...";
    });

    socket.addEventListener("message", (event) => {
      const message = JSON.parse(event.data);

      console.log("Server:", message);

      if (message.type === "CONNECTED") {
        status.textContent = "Connected to server.";
      }

      if (message.type === "FINDING_OPPONENT") {
        status.textContent = "Finding opponent...";
      }

      if (message.type === "MATCH_FOUND") {
        status.textContent = "Opponent found!";
        match.textContent =
          `Match ID: ${message.matchId} | Color: ${message.color}`;
      }

      if (message.type === "MATCH_START") {
        status.textContent = "Match started!";
      }

      if (message.type === "OPPONENT_DISCONNECTED") {
        status.textContent = "Opponent disconnected.";
      }

      if (message.type === "ERROR") {
        status.textContent = "Server error: " + message.message;
      }
    });

    socket.addEventListener("close", () => {
      status.textContent = "Disconnected from server.";
    });

    socket.addEventListener("error", () => {
      status.textContent = "Connection error.";
    });
  </script>
</body>
</html>
